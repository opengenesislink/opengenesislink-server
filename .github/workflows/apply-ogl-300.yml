name: Apply OpenGenesisLINK 3.0.0 payload

on:
  push:
    branches: [sync-3.0.0-dev]
    paths:
      - '.github/ogl-300-trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified 3.0.0 source payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/ogl-300-payload.part* > /tmp/ogl300.b64
          base64 -d /tmp/ogl300.b64 > /tmp/ogl300-source.tar.xz
          echo "dc9293cc65f01575ca2068a9f77a9ef11466906e3647da6b0c81cc65dc4c36ce  /tmp/ogl300-source.tar.xz" | sha256sum -c -
          rm -rf /tmp/ogl300-src
          mkdir -p /tmp/ogl300-src
          tar -xJf /tmp/ogl300-source.tar.xz -C /tmp/ogl300-src
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/ogl300-src/.clang-format /tmp/ogl300-src/.gitignore .
          cp -a /tmp/ogl300-src/CHANGELOG.md /tmp/ogl300-src/CMakeLists.txt /tmp/ogl300-src/CMakePresets.json /tmp/ogl300-src/LICENSE /tmp/ogl300-src/PUBLICATION.md /tmp/ogl300-src/README.md /tmp/ogl300-src/THIRD_PARTY.md /tmp/ogl300-src/VERSION .
          cp -a /tmp/ogl300-src/apps /tmp/ogl300-src/config /tmp/ogl300-src/docs /tmp/ogl300-src/include /tmp/ogl300-src/scripts /tmp/ogl300-src/src /tmp/ogl300-src/tests .
          git config user.name "OpenGenesis (MPL 2.0)"
          git config user.email "153564363+opengenesislink@users.noreply.github.com"
          git add -A -- ':!.github'
          git commit -m "OpenGenesisLINK Server 3.0.0-dev Hypergrid compatibility"
          git push origin HEAD:sync-3.0.0-dev
