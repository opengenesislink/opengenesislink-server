name: Apply OpenGenesisLINK 3.0.0 delta

on:
  push:
    branches: [sync-3.0.0-dev]
    paths:
      - '.github/ogl-300-trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified 3.0.0 source delta
        shell: bash
        run: |
          set -euo pipefail
          cat .github/ogl-300-delta.part* > /tmp/ogl300-delta.b64
          base64 -d /tmp/ogl300-delta.b64 > /tmp/ogl300-delta.tar.xz
          echo "f6b03d2a79d257956db8be01a1e96cac9fe58ea172b5a6d484b2f12a0c3ec283  /tmp/ogl300-delta.tar.xz" | sha256sum -c -
          tar -xJf /tmp/ogl300-delta.tar.xz -C .
          git config user.name "OpenGenesis (MPL 2.0)"
          git config user.email "153564363+opengenesislink@users.noreply.github.com"
          git add -A -- ':!.github'
          git commit -m "OpenGenesisLINK Server 3.0.0-dev Hypergrid compatibility"
          git push origin HEAD:sync-3.0.0-dev
