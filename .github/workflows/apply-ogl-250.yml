name: Apply OpenGenesisLINK 2.5.0 payload

on:
  push:
    branches: [sync-2.5.0-dev]
    paths:
      - '.github/ogl-250-payload.part14'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified 2.5.0 source payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/ogl-250-payload.part* > /tmp/ogl250.b64
          base64 -d /tmp/ogl250.b64 > /tmp/ogl250.tar.xz
          echo "b26ccc59dde963d973b1c75482955965baa8c4db7bb633088a2a210cf9ad7665  /tmp/ogl250.tar.xz" | sha256sum -c -
          rm -rf /tmp/ogl250-src
          mkdir -p /tmp/ogl250-src
          tar -xJf /tmp/ogl250.tar.xz -C /tmp/ogl250-src
          src=/tmp/ogl250-src
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a "$src"/.clang-format "$src"/.gitignore .
          cp -a "$src"/CHANGELOG.md "$src"/CMakeLists.txt "$src"/CMakePresets.json "$src"/LICENSE "$src"/PUBLICATION.md "$src"/README.md "$src"/THIRD_PARTY.md "$src"/VERSION .
          cp -a "$src"/apps "$src"/config "$src"/docs "$src"/include "$src"/scripts "$src"/src "$src"/tests .
          git config user.name "OpenGenesis (MPL 2.0)"
          git config user.email "153564363+opengenesislink@users.noreply.github.com"
          git add -A -- ':!.github'
          git commit -m "OpenGenesisLINK Server 2.5.0-dev federation and runtime foundation"
          git push origin HEAD:sync-2.5.0-dev
