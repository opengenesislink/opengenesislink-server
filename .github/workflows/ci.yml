name: C++ CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: cpp-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure release (warnings as errors)
        run: cmake --preset release -DOGL_ENABLE_WERROR=ON
      - name: Build
        run: cmake --build --preset release
      - name: Unit tests
        run: ctest --preset release
      - name: Integrated world/social/handoff smoke test
        run: bash ./scripts/run-smoke.sh
      - name: Script World query and ACK smoke test
        run: bash ./scripts/smoke-script-world.sh
      - name: Crossing v3 reservation and rollback smoke test
        run: bash ./scripts/smoke-crossing-v3.sh
