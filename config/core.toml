[network]
listen_address = "127.0.0.1"
port = 19000

[admin]
listen_address = "127.0.0.1"
port = 18080

[lease]
timeout_seconds = 15

[identity]
session_lifetime_seconds = 86400
scene_ticket_lifetime_seconds = 60

[security]
production_mode = false
scene_ticket_secret = "development-only-change-this-scene-ticket-secret"
scene_ticket_secret_env = "OGL_SCENE_TICKET_SECRET"
admin_api_key = "development-only-change-this-admin-api-key"
admin_api_key_env = "OGL_ADMIN_API_KEY"
world_node_secret = ""
world_node_secret_env = "OGL_WORLD_NODE_SECRET"
login_attempts_per_minute = 12
registration_attempts_per_minute = 30

[database]
# file keeps the legacy per-store persistence. Production SQL choices:
# sqlite, postgresql, mariadb
backend = "file"
sqlite_path = "data/opengenesis.db"
host = "127.0.0.1"
port = 0
name = "opengenesislink"
user = ""
password = ""
password_env = "OGL_DATABASE_PASSWORD"
ssl_mode = "preferred"
pool_size = 4
connect_timeout_seconds = 5

[storage]
worlds = "data/worlds.db"
regions = "data/regions.db"
users = "data/users.db"
sessions = "data/sessions.db"
assets_metadata = "data/assets.db"
assets_blobs = "data/assets"
appearance = "data/appearance.db"
inventory = "data/inventory.db"
friends = "data/friends.db"
messages = "data/messages.db"
social_policies = "data/social-policies.db"
economy = "data/economy.db"
marketplace = "data/marketplace.db"
groups = "data/groups.db"
parcels = "data/parcels.db"
moderation = "data/moderation.db"
audit = "data/audit.log"
admin_roles = "data/admin-roles.db"
estates = "data/estates.db"
landmarks = "data/landmarks.db"
notifications = "data/notifications.db"
group_channels = "data/group_channels.db"
crossings = "data/crossings.db"
object_crossings = "data/object-crossings.db"
scripts = "data/scripts.db"
script_world_actions = "data/script-world-actions.db"
federation_identity = "data/federation-identity.db"
federation_trust = "data/federation-trust.db"
federation_sessions = "data/federation-sessions.db"
federation_service_grants = "data/federation-service-grants.db"
hypergrid_sessions = "data/hypergrid-sessions.db"

[assets]
max_bytes = 1048576

[scripting]
max_pending_world_actions = 4096
world_action_max_attempts = 5
world_action_lease_ms = 2000
world_action_ttl_ms = 60000

[crossing]
object_max_attempts = 5

[federation]
grid_id = "local.opengenesislink"
base_url = "http://127.0.0.1:18080"

[hypergrid]
enabled = false
inventory_write_enabled = false
inventory_write_secret = ""
listen_address = "127.0.0.1"
port = 18081
external_name = "http://127.0.0.1:18081"
home_uri = "http://127.0.0.1:18081"
asset_uri = "http://127.0.0.1:18081"
inventory_uri = "http://127.0.0.1:18081"
avatar_uri = "http://127.0.0.1:18081"
friends_uri = "http://127.0.0.1:18081"
im_uri = "http://127.0.0.1:18081"
region_host = "127.0.0.1"
region_http_port = 19100
region_internal_port = 19100

[economy]
currency_code = "OGL"
